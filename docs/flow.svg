<svg xmlns="http://www.w3.org/2000/svg" width="680" height="2198" viewBox="0 0 680 2198" role="img">
<title>Sanya message flow</title>
<desc>Every server message is logged and later feeds memory; a message addressed to Sanya passes through intake, the building of the prompt, the model loop and the outbox.</desc>
<style>
  .bg{fill:#ffffff}
  text{font-family:'Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif}
  .t{font-size:14px;font-weight:600}.s{font-size:12px}.g{font-size:12px;fill:#5f5e5a}
  .step rect{fill:#eeedfe;stroke:#534ab7}.step .t{fill:#3c3489}.step .s{fill:#534ab7}
  .store rect{fill:#e1f5ee;stroke:#0f6e56}.store .t{fill:#085041}.store .s{fill:#0f6e56}
  .end rect,.stop rect{fill:#f1efe8;stroke:#5f5e5a}.end .t,.stop .t{fill:#2c2c2a}.end .s,.stop .s{fill:#5f5e5a}
  .grp{fill:none;stroke:#888780;stroke-dasharray:4 4}
  .ar{stroke:#5f5e5a;stroke-width:1.5;fill:none}.ah{stroke:#5f5e5a;stroke-width:1.5;fill:none}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1f1f1d}.g{fill:#b4b2a9}
    .step rect{fill:#3c3489;stroke:#afa9ec}.step .t{fill:#eeedfe}.step .s{fill:#cecbf6}
    .store rect{fill:#085041;stroke:#5dcaa5}.store .t{fill:#e1f5ee}.store .s{fill:#9fe1cb}
    .end rect,.stop rect{fill:#444441;stroke:#b4b2a9}.end .t,.stop .t{fill:#f1efe8}.end .s,.stop .s{fill:#d3d1c7}
    .grp{stroke:#888780}.ar,.ah{stroke:#b4b2a9}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah" d="M2 1L8 5L2 9" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="2198"/>
<rect class="grp" x="24" y="106" width="372" height="560" rx="12"/>
<text class="g" x="40" y="122" dominant-baseline="central">Intake</text>
<rect class="grp" x="24" y="686" width="372" height="408" rx="12"/>
<text class="g" x="40" y="702" dominant-baseline="central">Building the prompt</text>
<rect class="grp" x="24" y="1114" width="372" height="180" rx="12"/>
<text class="g" x="40" y="1130" dominant-baseline="central">Model loop</text>
<rect class="grp" x="24" y="1314" width="372" height="256" rx="12"/>
<text class="g" x="40" y="1330" dominant-baseline="central">Outbox</text>
<rect class="grp" x="24" y="1690" width="632" height="484" rx="12"/>
<text class="g" x="40" y="1706" dominant-baseline="central">Background: only when nobody has addressed her for two minutes</text>
<line class="ar" x1="210" y1="88" x2="210" y2="134" marker-end="url(#a)"/>
<line class="ar" x1="210" y1="196" x2="210" y2="210" marker-end="url(#a)"/>
<line class="ar" x1="384" y1="242" x2="436" y2="242" marker-end="url(#a)"/>
<line class="ar" x1="210" y1="272" x2="210" y2="286" marker-end="url(#a)"/>
<line class="ar" x1="384" y1="318" x2="436" y2="318" marker-end="url(#a)"/>
<line class="ar" x1="210" y1="348" x2="210" y2="362" marker-end="url(#a)"/>
<line class="ar" x1="210" y1="424" x2="210" y2="438" marker-end="url(#a)"/>
<line class="ar" x1="210" y1="500" x2="210" y2="514" marker-end="url(#a)"/>
<line class="ar" x1="384" y1="546" x2="436" y2="546" marker-end="url(#a)"/>
<line class="ar" x1="210" y1="576" x2="210" y2="590" marker-end="url(#a)"/>
<line class="ar" x1="384" y1="622" x2="436" y2="622" marker-start="url(#a)" marker-end="url(#a)"/>
<line class="ar" x1="210" y1="652" x2="210" y2="714" marker-end="url(#a)"/>
<line class="ar" x1="384" y1="746" x2="436" y2="746" marker-start="url(#a)"/>
<line class="ar" x1="210" y1="776" x2="210" y2="790" marker-end="url(#a)"/>
<line class="ar" x1="384" y1="822" x2="436" y2="822" marker-start="url(#a)"/>
<line class="ar" x1="210" y1="852" x2="210" y2="866" marker-end="url(#a)"/>
<line class="ar" x1="384" y1="898" x2="436" y2="898" marker-start="url(#a)"/>
<line class="ar" x1="210" y1="928" x2="210" y2="942" marker-end="url(#a)"/>
<line class="ar" x1="384" y1="974" x2="436" y2="974" marker-start="url(#a)"/>
<line class="ar" x1="210" y1="1004" x2="210" y2="1018" marker-end="url(#a)"/>
<line class="ar" x1="384" y1="1050" x2="436" y2="1050" marker-start="url(#a)"/>
<line class="ar" x1="210" y1="1080" x2="210" y2="1142" marker-end="url(#a)"/>
<line class="ar" x1="384" y1="1174" x2="436" y2="1174" marker-start="url(#a)" marker-end="url(#a)"/>
<line class="ar" x1="210" y1="1204" x2="210" y2="1218" marker-start="url(#a)" marker-end="url(#a)"/>
<line class="ar" x1="384" y1="1250" x2="436" y2="1250" marker-start="url(#a)" marker-end="url(#a)"/>
<line class="ar" x1="210" y1="1280" x2="210" y2="1342" marker-end="url(#a)"/>
<line class="ar" x1="384" y1="1374" x2="436" y2="1374" marker-start="url(#a)"/>
<line class="ar" x1="210" y1="1404" x2="210" y2="1418" marker-end="url(#a)"/>
<line class="ar" x1="384" y1="1450" x2="436" y2="1450" marker-end="url(#a)"/>
<line class="ar" x1="210" y1="1480" x2="210" y2="1494" marker-end="url(#a)"/>
<line class="ar" x1="384" y1="1526" x2="436" y2="1526" marker-end="url(#a)"/>
<line class="ar" x1="210" y1="1556" x2="210" y2="1586" marker-end="url(#a)"/>
<line class="ar" x1="384" y1="1750" x2="436" y2="1750" marker-start="url(#a)" marker-end="url(#a)"/>
<line class="ar" x1="384" y1="1826" x2="436" y2="1826" marker-end="url(#a)"/>
