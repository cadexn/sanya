<line class="ar" x1="384" y1="1978" x2="436" y2="1978" marker-end="url(#a)"/>
<line class="ar" x1="384" y1="2054" x2="436" y2="2054" marker-end="url(#a)"/>
<line class="ar" x1="384" y1="2130" x2="436" y2="2130" marker-end="url(#a)"/>
<g class="end"><rect x="40" y="30" width="340" height="56" rx="8" stroke-width="1"/><text class="t" x="210" y="49" text-anchor="middle" dominant-baseline="central">Any message in the server</text><text class="s" x="210" y="68" text-anchor="middle" dominant-baseline="central">pinged or not; private messages never arrive</text></g>
<g class="step"><rect x="40" y="138" width="340" height="56" rx="8" stroke-width="1"/><text class="t" x="210" y="157" text-anchor="middle" dominant-baseline="central">Admission</text><text class="s" x="210" y="176" text-anchor="middle" dominant-baseline="central">switched-on servers only; no repeats</text></g>
<g class="step"><rect x="40" y="214" width="340" height="56" rx="8" stroke-width="1"/><text class="t" x="210" y="233" text-anchor="middle" dominant-baseline="central">Room log</text><text class="s" x="210" y="252" text-anchor="middle" dominant-baseline="central">every message recorded, with what it answers</text></g>
<g class="store"><rect x="440" y="214" width="200" height="56" rx="8" stroke-width="1"/><text class="t" x="540" y="233" text-anchor="middle" dominant-baseline="central">Room log store</text><text class="s" x="540" y="252" text-anchor="middle" dominant-baseline="central">SQLite, kept 7 days</text></g>
<g class="step"><rect x="40" y="290" width="340" height="56" rx="8" stroke-width="1"/><text class="t" x="210" y="309" text-anchor="middle" dominant-baseline="central">Addressed to Sanya?</text><text class="s" x="210" y="328" text-anchor="middle" dominant-baseline="central">a mention or a reply, not in a no-reply channel</text></g>
<g class="stop"><rect x="440" y="290" width="200" height="56" rx="8" stroke-width="1"/><text class="t" x="540" y="309" text-anchor="middle" dominant-baseline="central">Not addressed</text><text class="s" x="540" y="328" text-anchor="middle" dominant-baseline="central">heard; pictures kept</text></g>
<g class="step"><rect x="40" y="366" width="340" height="56" rx="8" stroke-width="1"/><text class="t" x="210" y="385" text-anchor="middle" dominant-baseline="central">Bot exchange rule</text><text class="s" x="210" y="404" text-anchor="middle" dominant-baseline="central">a bot gets a reply, then a plain answer</text></g>
<g class="step"><rect x="40" y="442" width="340" height="56" rx="8" stroke-width="1"/><text class="t" x="210" y="461" text-anchor="middle" dominant-baseline="central">Batching</text><text class="s" x="210" y="480" text-anchor="middle" dominant-baseline="central">no wait, one turn at a time per channel</text></g>
<g class="step"><rect x="40" y="518" width="340" height="56" rx="8" stroke-width="1"/><text class="t" x="210" y="537" text-anchor="middle" dominant-baseline="central">Files and quoted message</text><text class="s" x="210" y="556" text-anchor="middle" dominant-baseline="central">up to four files, type-checked and kept</text></g>
<g class="store"><rect x="440" y="518" width="200" height="56" rx="8" stroke-width="1"/><text class="t" x="540" y="537" text-anchor="middle" dominant-baseline="central">File store</text><text class="s" x="540" y="556" text-anchor="middle" dominant-baseline="central">on disk, never deleted</text></g>
<g class="step"><rect x="40" y="594" width="340" height="56" rx="8" stroke-width="1"/><text class="t" x="210" y="613" text-anchor="middle" dominant-baseline="central">Security check</text><text class="s" x="210" y="632" text-anchor="middle" dominant-baseline="central">flagged: no tools, nothing to memory</text></g>
<g class="store"><rect x="440" y="594" width="200" height="56" rx="8" stroke-width="1"/><text class="t" x="540" y="613" text-anchor="middle" dominant-baseline="central">Model server</text><text class="s" x="540" y="632" text-anchor="middle" dominant-baseline="central">one-word verdict</text></g>
<g class="step"><rect x="40" y="718" width="340" height="56" rx="8" stroke-width="1"/><text class="t" x="210" y="737" text-anchor="middle" dominant-baseline="central">Channel conversation</text><text class="s" x="210" y="756" text-anchor="middle" dominant-baseline="central">one per channel, last 40 messages</text></g>
<g class="store"><rect x="440" y="718" width="200" height="56" rx="8" stroke-width="1"/><text class="t" x="540" y="737" text-anchor="middle" dominant-baseline="central">History store</text><text class="s" x="540" y="756" text-anchor="middle" dominant-baseline="central">SQLite, kept 30 days</text></g>
<g class="step"><rect x="40" y="794" width="340" height="56" rx="8" stroke-width="1"/><text class="t" x="210" y="813" text-anchor="middle" dominant-baseline="central">Room context</text><text class="s" x="210" y="832" text-anchor="middle" dominant-baseline="central">last 30 minutes, 2 newest pictures</text></g>
<g class="store"><rect x="440" y="794" width="200" height="56" rx="8" stroke-width="1"/><text class="t" x="540" y="813" text-anchor="middle" dominant-baseline="central">Room log store</text><text class="s" x="540" y="832" text-anchor="middle" dominant-baseline="central">what was said nearby</text></g>
<g class="step"><rect x="40" y="870" width="340" height="56" rx="8" stroke-width="1"/><text class="t" x="210" y="889" text-anchor="middle" dominant-baseline="central">Image and emoji chance</text><text class="s" x="210" y="908" text-anchor="middle" dominant-baseline="central">asked, 25% chance, or off; emoji 15%</text></g>
<g class="store"><rect x="440" y="870" width="200" height="56" rx="8" stroke-width="1"/><text class="t" x="540" y="889" text-anchor="middle" dominant-baseline="central">Ledgers</text><text class="s" x="540" y="908" text-anchor="middle" dominant-baseline="central">cooldowns, no-GIF wishes</text></g>
<g class="step"><rect x="40" y="946" width="340" height="56" rx="8" stroke-width="1"/><text class="t" x="210" y="965" text-anchor="middle" dominant-baseline="central">Recall</text><text class="s" x="210" y="984" text-anchor="middle" dominant-baseline="central">8 facts about the speaker and the topic</text></g>
<g class="store"><rect x="440" y="946" width="200" height="56" rx="8" stroke-width="1"/><text class="t" x="540" y="965" text-anchor="middle" dominant-baseline="central">Hindsight</text><text class="s" x="540" y="984" text-anchor="middle" dominant-baseline="central">facts only, no summaries</text></g>
<g class="step"><rect x="40" y="1022" width="340" height="56" rx="8" stroke-width="1"/><text class="t" x="210" y="1041" text-anchor="middle" dominant-baseline="central">Prompt assembly</text><text class="s" x="210" y="1060" text-anchor="middle" dominant-baseline="central">persona, rules, scene, who she is answering</text></g>
<g class="store"><rect x="440" y="1022" width="200" height="56" rx="8" stroke-width="1"/><text class="t" x="540" y="1041" text-anchor="middle" dominant-baseline="central">Persona files</text><text class="s" x="540" y="1060" text-anchor="middle" dominant-baseline="central">SOUL VOICE POLICY RULES</text></g>
<g class="step"><rect x="40" y="1146" width="340" height="56" rx="8" stroke-width="1"/><text class="t" x="210" y="1165" text-anchor="middle" dominant-baseline="central">Model call</text><text class="s" x="210" y="1184" text-anchor="middle" dominant-baseline="central">up to eight; empty or stage note: one retry</text></g>
<g class="store"><rect x="440" y="1146" width="200" height="56" rx="8" stroke-width="1"/><text class="t" x="540" y="1165" text-anchor="middle" dominant-baseline="central">Model server</text><text class="s" x="540" y="1184" text-anchor="middle" dominant-baseline="central">one call at a time</text></g>
<g class="step"><rect x="40" y="1222" width="340" height="56" rx="8" stroke-width="1"/><text class="t" x="210" y="1241" text-anchor="middle" dominant-baseline="central">Tool calls</text><text class="s" x="210" y="1260" text-anchor="middle" dominant-baseline="central">three per answer; none when flagged</text></g>
<g class="store"><rect x="440" y="1222" width="200" height="56" rx="8" stroke-width="1"/><text class="t" x="540" y="1241" text-anchor="middle" dominant-baseline="central">Tools</text><text class="s" x="540" y="1260" text-anchor="middle" dominant-baseline="central">web, files, memory, images</text></g>
<g class="step"><rect x="40" y="1346" width="340" height="56" rx="8" stroke-width="1"/><text class="t" x="210" y="1365" text-anchor="middle" dominant-baseline="central">Egress gate</text><text class="s" x="210" y="1384" text-anchor="middle" dominant-baseline="central">secrets, paths, backstage talk: fixed line</text></g>
<g class="store"><rect x="440" y="1346" width="200" height="56" rx="8" stroke-width="1"/><text class="t" x="540" y="1365" text-anchor="middle" dominant-baseline="central">Fixed lines</text><text class="s" x="540" y="1384" text-anchor="middle" dominant-baseline="central">refusal, brush-off, error</text></g>
<g class="step"><rect x="40" y="1422" width="340" height="56" rx="8" stroke-width="1"/><text class="t" x="210" y="1441" text-anchor="middle" dominant-baseline="central">Send</text><text class="s" x="210" y="1460" text-anchor="middle" dominant-baseline="central">reply, image, emoji; nobody is pinged</text></g>
<g class="store"><rect x="440" y="1422" width="200" height="56" rx="8" stroke-width="1"/><text class="t" x="540" y="1441" text-anchor="middle" dominant-baseline="central">Discord</text><text class="s" x="540" y="1460" text-anchor="middle" dominant-baseline="central">a reply without a ping</text></g>
<g class="step"><rect x="40" y="1498" width="340" height="56" rx="8" stroke-width="1"/><text class="t" x="210" y="1517" text-anchor="middle" dominant-baseline="central">Save turn</text><text class="s" x="210" y="1536" text-anchor="middle" dominant-baseline="central">message, reply, notes, facts she had; ledgers</text></g>
<g class="store"><rect x="440" y="1498" width="200" height="56" rx="8" stroke-width="1"/><text class="t" x="540" y="1517" text-anchor="middle" dominant-baseline="central">History store</text><text class="s" x="540" y="1536" text-anchor="middle" dominant-baseline="central">same SQLite file</text></g>
<g class="end"><rect x="40" y="1590" width="340" height="56" rx="8" stroke-width="1"/><text class="t" x="210" y="1609" text-anchor="middle" dominant-baseline="central">Turn finished</text><text class="s" x="210" y="1628" text-anchor="middle" dominant-baseline="central">she waits until someone addresses her again</text></g>
<g class="step"><rect x="40" y="1722" width="340" height="56" rx="8" stroke-width="1"/><text class="t" x="210" y="1741" text-anchor="middle" dominant-baseline="central">Describe overheard pictures</text><text class="s" x="210" y="1760" text-anchor="middle" dominant-baseline="central">one at a time; the file is kept</text></g>
<g class="store"><rect x="440" y="1722" width="200" height="56" rx="8" stroke-width="1"/><text class="t" x="540" y="1741" text-anchor="middle" dominant-baseline="central">Model server</text><text class="s" x="540" y="1760" text-anchor="middle" dominant-baseline="central">vision call</text></g>
<g class="step"><rect x="40" y="1798" width="340" height="56" rx="8" stroke-width="1"/><text class="t" x="210" y="1817" text-anchor="middle" dominant-baseline="central">Take back deleted messages</text><text class="s" x="210" y="1836" text-anchor="middle" dominant-baseline="central">the batch is sent again without them</text></g>
<g class="store"><rect x="440" y="1798" width="200" height="56" rx="8" stroke-width="1"/><text class="t" x="540" y="1817" text-anchor="middle" dominant-baseline="central">Hindsight</text><text class="s" x="540" y="1836" text-anchor="middle" dominant-baseline="central">documents replaced</text></g>
<g class="step"><rect x="40" y="1874" width="340" height="56" rx="8" stroke-width="1"/><text class="t" x="210" y="1893" text-anchor="middle" dominant-baseline="central">Memory batch: members&#x27; lines</text><text class="s" x="210" y="1912" text-anchor="middle" dominant-baseline="central">facts about people; claims about her dropped</text></g>
<g class="store"><rect x="440" y="1874" width="200" height="56" rx="8" stroke-width="1"/><text class="t" x="540" y="1893" text-anchor="middle" dominant-baseline="central">Hindsight</text><text class="s" x="540" y="1912" text-anchor="middle" dominant-baseline="central">document 1 of a batch</text></g>
<g class="step"><rect x="40" y="1950" width="340" height="56" rx="8" stroke-width="1"/><text class="t" x="210" y="1969" text-anchor="middle" dominant-baseline="central">Memory batch: her own lines</text><text class="s" x="210" y="1988" text-anchor="middle" dominant-baseline="central">only facts about her alone are kept</text></g>
<g class="store"><rect x="440" y="1950" width="200" height="56" rx="8" stroke-width="1"/><text class="t" x="540" y="1969" text-anchor="middle" dominant-baseline="central">Hindsight</text><text class="s" x="540" y="1988" text-anchor="middle" dominant-baseline="central">document 2 of a batch</text></g>
<g class="step"><rect x="40" y="2026" width="340" height="56" rx="8" stroke-width="1"/><text class="t" x="210" y="2045" text-anchor="middle" dominant-baseline="central">Hearsay expiry and merge</text><text class="s" x="210" y="2064" text-anchor="middle" dominant-baseline="central">hearsay out after 90 days; hourly merge</text></g>
<g class="store"><rect x="440" y="2026" width="200" height="56" rx="8" stroke-width="1"/><text class="t" x="540" y="2045" text-anchor="middle" dominant-baseline="central">Hindsight</text><text class="s" x="540" y="2064" text-anchor="middle" dominant-baseline="central">retire and merge calls</text></g>
<g class="step"><rect x="40" y="2102" width="340" height="56" rx="8" stroke-width="1"/><text class="t" x="210" y="2121" text-anchor="middle" dominant-baseline="central">Housekeeping</text><text class="s" x="210" y="2140" text-anchor="middle" dominant-baseline="central">log 7 days, history 30, status every 4 h</text></g>
<g class="store"><rect x="440" y="2102" width="200" height="56" rx="8" stroke-width="1"/><text class="t" x="540" y="2121" text-anchor="middle" dominant-baseline="central">SQLite and Discord</text><text class="s" x="540" y="2140" text-anchor="middle" dominant-baseline="central">expiry, presence</text></g>
</svg>
